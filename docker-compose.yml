services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api/backend
      - BACKEND_INTERNAL_URL=http://backend:8000
    ports:
      - "80:3000"
    depends_on:
      - backend